# pnpm 10 n'exécute aucun script d'installation sans autorisation explicite.
# Quatre paquets en ont réellement besoin, et les quatre échouent en silence
# sans cette liste — `pnpm approve-builds` est interactif, donc inutilisable
# en CI.
#   @prisma/client · génère le client au postinstall
#   prisma         · télécharge les engines du CLI (cf. Dockerfile, stage runner)
#   bcrypt         · module natif, binaire prébuilt ou compilation node-gyp
#   esbuild        · binaire posé au postinstall. Moteur de tsx, qui exécute
#                    prisma/seed.ts en local, ET transpileur du même seed au
#                    stage builder du Dockerfile (T-J0-08)
onlyBuiltDependencies:
  - "@prisma/client"
  - prisma
  - bcrypt
  - esbuild
  # sharp          · binaires natifs de traitement d'image. Déplacé DEPUIS
  #                  `ignoredBuiltDependencies` en T-V3-08 : il n'était tiré
  #                  que par Next, qui s'en passe, mais le strip EXIF des
  #                  photos du tunnel l'appelle directement. Sans script
  #                  d'installation, pnpm 10 le laisse sans binaire — en
  #                  silence, comme il l'a fait pour bcrypt
  - sharp
  # lefthook       · POSE les hooks Git au postinstall, c'est tout ce que fait
  #                  son script. Sans cette ligne, `pnpm add -D lefthook`
  #                  affiche « Ignored build scripts » et le dépôt se retrouve
  #                  avec un `lefthook.yml` que rien ne déclenche : la garde
  #                  serait purement décorative, et personne ne s'en
  #                  apercevrait avant le premier commit mal formaté.
  #                  Constaté à l'installation, audit du 2026-08-12
  - lefthook

ignoredBuiltDependencies:
  - unrs-resolver
  # msw ne pose au postinstall que `mockServiceWorker.js` dans `public/`, pour
  # son mode NAVIGATEUR. HCH ne l'utilise que côté Node, dans Vitest — les E2E
  # Playwright tapent des URL réelles et n'ont rien à intercepter (T-J0-09).
  # Déclaré ici plutôt que laissé en warning : un script ignoré doit l'être
  # sciemment, sinon on ne distingue plus l'inoffensif du cassant.
  - msw
