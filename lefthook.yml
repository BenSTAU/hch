# Hooks Git - DEFAULT de CLAUDE.md §Tooling, posé par l'audit du 2026-08-12.
#
# Le dépôt n'avait AUCUN hook actif : ni lefthook, ni husky, ni rien dans
# `.git/hooks`. Tout reposait sur la discipline et sur la CI, c'est-à-dire sur
# un rouge découvert après coup.
#
# ── Le partage entre les deux hooks n'est pas arbitraire
#
# CLAUDE.md pose un MUST NOT explicite : `tsc --noEmit` ne va PAS en
# `lint-staged`. Il doit voir tout le projet pour rendre un verdict juste, et le
# restreindre aux fichiers indexés produit des erreurs fantômes autant que des
# silences - un type cassé par un fichier non indexé ne se verrait pas.
#
# D'où : ce qui est par-fichier au commit, ce qui est global au push.
#
# ⚠️ `lefthook` doit figurer dans `onlyBuiltDependencies` de
# `pnpm-workspace.yaml`, sinon pnpm 10 n'exécute pas son postinstall et ces
# hooks ne sont jamais posés - en silence.

pre-commit:
  parallel: false
  commands:
    # Un seul appel, piloté par `lint-staged` : c'est lui qui sait quels
    # fichiers sont indexés et qui restitue l'index après correction.
    lint-staged:
      run: pnpm exec lint-staged

pre-push:
  # Les deux sont indépendants et longs : les paralléliser divise l'attente.
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test

  # ⚠️ La barrière E2E n'est PAS ici, et c'est délibéré. Elle dure entre huit et
  # quatorze minutes, elle exige le tunnel SSH vers la base de développement, et
  # sa raison d'être est d'être une barrière PRÉ-DÉPLOIEMENT (T-J0-09), pas une
  # gate de push. La mettre là rendrait le push impraticable hors tunnel, donc
  # elle finirait contournée par `--no-verify` - ce qui vaut moins que rien.
